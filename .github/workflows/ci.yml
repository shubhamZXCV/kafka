# One job (implementation plan §4, CI): build with the dev preset (ASan + UBSan), check
# formatting, run the fast functional suite. The tsan build and the slow scenarios are run
# by hand before submission.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format-18
          python3 -m pip install --break-system-packages pytest pandas

      # Sanitizer runtimes fail on kernels with high address randomisation (CLAUDE.md).
      - name: Lower mmap randomisation
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Check formatting
        run: git ls-files '*.cc' '*.h' | xargs clang-format-18 --dry-run --Werror

      - name: Build (dev preset)
        run: |
          cmake --preset dev
          cmake --build --preset dev

      - name: Functional tests (not slow)
        run: python3 -m pytest tests/functional -m "not slow" -q --durations=5

      - name: Keep test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-logs
          path: /tmp/pytest-of-*/pytest-*/
          retention-days: 7
